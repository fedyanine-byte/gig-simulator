<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CapyUber — Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #06090F;
    --surface: #0D1520;
    --surface2: #162030;
    --border: #1E2D40;
    --blue: #D4A000;
    --blue-lt: #F5BE00;
    --green: #10B981;
    --orange: #F59E0B;
    --red: #EF4444;
    --text: #E2EAF4;
    --muted: #4B6280;
    --dim: #7C94AD;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', 'SF Mono', monospace;
    --ride-duration: 3s;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ─── JOIN SCREEN ─── */
  #joinScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 0;
  }
  .join-logo { font-size: 64px; margin-bottom: 4px; }
  .join-title { font-size: 26px; font-weight: 600; color: var(--blue-lt); }
  .join-sub { color: var(--dim); font-size: 14px; margin-bottom: 40px; }
  .join-input {
    width: 100%; padding: 14px 16px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text); font-family: var(--font);
    font-size: 18px; font-weight: 500; text-align: center;
    outline: none; transition: border-color .2s;
    -webkit-appearance: none;
  }
  .join-input:focus { border-color: var(--blue); }
  .join-btn {
    margin-top: 16px; width: 100%; padding: 15px;
    background: var(--blue); border: none; border-radius: 12px;
    color: #000; font-family: var(--font); font-size: 16px; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .join-btn:active { opacity: .8; }
  .join-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* ─── MAIN APP ─── */
  #mainScreen { display: none; flex-direction: column; min-height: 100dvh; }

  /* HEADER */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .hdr-name { font-size: 13px; color: var(--dim); }
  .hdr-name span { color: var(--text); font-weight: 600; }
  .hdr-round { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .hdr-round strong { color: var(--blue-lt); }

  /* STATUS BAR */
  .status-bar {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; padding: 12px 14px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .stat-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-family: var(--mono); font-size: 18px; font-weight: 500; }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.red { color: var(--red); }

  /* FUEL BAR */
  .fuel-bar-wrap { padding: 6px 14px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .fuel-bar-row { display: flex; align-items: center; gap: 8px; }
  .fuel-label { font-size: 11px; color: var(--muted); min-width: 28px; }
  .fuel-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .fuel-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width .5s, background .5s; }
  .fuel-pct { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 32px; text-align: right; }

  /* ACTION BUTTONS ROW */
  .action-row {
    display: flex; gap: 8px; padding: 10px 14px 4px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .action-btn {
    flex: 1; padding: 8px 4px; border: 1.5px solid var(--border);
    border-radius: 10px; background: var(--surface2); color: var(--dim);
    font-family: var(--font); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all .2s; text-align: center; line-height: 1.3;
  }
  .action-btn .btn-emoji { display: block; font-size: 18px; margin-bottom: 2px; }
  .action-btn:active { opacity: .7; }
  .action-btn.glow-green {
    border-color: var(--green); color: var(--green);
    box-shadow: 0 0 0 0 rgba(16,185,129,.5);
    animation: pulseGreen 1.4s ease-in-out infinite;
  }
  .action-btn.glow-orange {
    border-color: var(--orange); color: var(--orange);
    box-shadow: 0 0 0 0 rgba(245,158,11,.5);
    animation: pulseOrange 1.4s ease-in-out infinite;
  }
  @keyframes pulseGreen {
    0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.4); }
    50% { box-shadow: 0 0 8px 3px rgba(16,185,129,.25); }
  }
  @keyframes pulseOrange {
    0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.4); }
    50% { box-shadow: 0 0 8px 3px rgba(245,158,11,.25); }
  }

  /* SCROLL CONTENT */
  .scroll-content { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

  /* ROUND BADGE */
  .round-badge {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; font-size: 12px; color: var(--dim); align-self: center;
  }
  .round-badge strong { color: var(--blue-lt); }

  /* WAITING */
  .waiting-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .waiting-emoji { font-size: 40px; }
  .waiting-title { font-size: 16px; font-weight: 600; color: var(--dim); }
  .waiting-sub { font-size: 13px; color: var(--muted); }
  .dot-pulse { display: flex; gap: 5px; justify-content: center; margin-top: 4px; }
  .dot-pulse span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: .2s; }
  .dot-pulse span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* ORDER CARD */
  .order-card {
    background: var(--surface); border: 1.5px solid var(--blue);
    border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;
    animation: slideUp .3s ease-out;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .order-header { display: flex; align-items: center; gap: 10px; }
  .order-emoji { font-size: 28px; }
  .order-title { font-size: 17px; font-weight: 600; }
  .order-scenario { font-size: 12px; color: var(--dim); margin-top: 1px; }
  .order-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .order-meta-item { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
  .order-meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .order-meta-value { font-size: 16px; font-weight: 600; margin-top: 3px; font-family: var(--mono); }
  .order-difficult { font-size: 12px; color: var(--dim); padding: 8px 12px; background: var(--surface2); border-radius: 8px; border-left: 3px solid var(--orange); }
  .order-accept {
    width: 100%; padding: 14px; background: var(--blue); border: none; border-radius: 12px;
    color: #000; font-family: var(--font); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .order-accept:active { opacity: .8; }
  .order-skip {
    width: 100%; padding: 10px; background: none; border: 1px solid var(--border);
    border-radius: 12px; color: var(--dim); font-family: var(--font); font-size: 14px;
    cursor: pointer; transition: opacity .2s;
  }
  .order-skip:active { opacity: .6; }

  /* RIDE ANIMATION CARD */
  .ride-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 16px 20px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; gap: 12px;
  }
  .ride-title { font-size: 15px; font-weight: 600; color: var(--dim); text-align: center; }
  .ride-road {
    position: relative; height: 48px; background: var(--surface2);
    border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
  }
  .ride-road-line {
    position: absolute; top: 50%; left: 0; right: 0; height: 2px;
    background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 16px, transparent 16px, transparent 28px);
    transform: translateY(-50%);
  }
  .ride-car {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 24px; left: -5%;
    animation: driveAcross var(--ride-duration) linear forwards;
  }
  @keyframes driveAcross { from { left: -5%; } to { left: 105%; } }
  .ride-dest { font-size: 13px; color: var(--muted); text-align: center; }

  /* RESULTS CARD */
  .results-card {
    background: var(--surface); border: 1.5px solid var(--green);
    border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 0;
    animation: slideUp .3s ease-out;
  }
  .results-header { font-size: 16px; font-weight: 600; margin-bottom: 14px; text-align: center; }
  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--border);
    opacity: 0; transition: opacity .4s;
  }
  .result-row.visible { opacity: 1; }
  .result-row:last-of-type { border-bottom: none; }
  .result-label { font-size: 13px; color: var(--dim); }
  .result-value { font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .result-value.green { color: var(--green); }
  .result-value.red { color: var(--red); }
  .result-value.orange { color: var(--orange); }
  .result-comment { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
  .results-dismiss {
    margin-top: 14px; width: 100%; padding: 12px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 12px; color: var(--dim);
    font-family: var(--font); font-size: 14px; cursor: pointer; opacity: 0;
    transition: opacity .4s;
  }
  .results-dismiss.visible { opacity: 1; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 24px; padding: 9px 18px; font-size: 13px; color: var(--text);
    white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s;
    z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SUSPENDED OVERLAY */
  .suspended-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(6,9,15,.97);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    gap: 12px;
  }
  .suspended-overlay.active { display: flex; }
  .suspended-icon { font-size: 56px; }
  .suspended-title { font-size: 22px; font-weight: 700; color: var(--red); }
  .suspended-body { font-size: 14px; color: var(--dim); line-height: 1.6; max-width: 300px; }
  .suspended-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* GAME ENDED */
  .ended-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 10px;
  }
  .ended-emoji { font-size: 48px; }
  .ended-title { font-size: 20px; font-weight: 700; color: var(--blue-lt); }
  .ended-sub { font-size: 13px; color: var(--dim); }
  .ended-final { font-size: 32px; font-weight: 700; font-family: var(--mono); }

  /* WAITING FOR ROUND */
  .between-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 8px;
  }

  /* RATING STARS */
  .stars { font-size: 20px; letter-spacing: 2px; }
</style>
</head>

<!-- JOIN SCREEN -->
<div id="joinScreen">

  <div class="join-error" id="joinError"></div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">

  <div class="hdr">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="stat-cell">
      <div class="stat-label">Balance</div>

    </div>
    <div class="stat-cell">
      <div class="stat-label">Rating</div>
      <div class="stat-value" id="statRating">100%</div>
    </div>
    <div class="stat-cell">
      <div class="stat-label">Trips</div>
      <div class="stat-value" id="statTrips">0</div>
    </div>
  </div>

  <!-- Fuel Bar -->
  <div class="fuel-bar-wrap">
    <div class="fuel-bar-row">
      <div class="fuel-label">⛽</div>

      <div class="fuel-pct" id="fuelPct">100%</div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row">

  <!-- Scroll Content -->
  <div class="scroll-content" id="mainContent">
    <!-- Dynamic content inserted here -->
  </div>
</div>

<!-- Suspended Overlay -->
<div class="suspended-overlay" id="suspendedOverlay">

  <div class="suspended-hint">Wait for the instructor to end the game or ask for help.</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

  { emoji:'🎉', title:'City festival',       body:'High demand across the city! Your next order will be surge-priced.',        surge:true },
  { emoji:'🔧', title:'Check engine light',  body:'Appeared mid-trip. Cannot be ignored. Workshop visit inevitable.',           cost:5 },
  { emoji:'💥', title:'Fender bender',       body:'A slow-speed incident at a junction. The bill was not slow.',               cost:8 },
  { emoji:'🪟', title:'Window stuck',        body:'Electric window jammed open in November. Fixed. Eventually.',               cost:3 },
  { emoji:'🔩', title:'Flat tyre',           body:'Caught it on a kerb. Changed it yourself. Still cost you.',                 cost:6, fuelExtra:5 },
  { emoji:'🍓', title:'Smoothie incident',   body:"Client's smoothie found the seat seam. Difficult to explain to the next passenger.", cost:2 },
];

// ─── STATE ──────────────────────────────────────────────────
let driverId   = localStorage.getItem('driverId')   || null;
let driverNum  = parseInt(localStorage.getItem('driverNumber') || '0');
let gameState  = null;
let driverState = null;
let tripState  = 'idle'; // 'idle' | 'riding' | 'results'
let pendingOrder = null;
let nextSurge  = false;
let lastRenderRound = -1;
let unsub = null;

// ─── HELPERS ────────────────────────────────────────────────
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmtEur(v) { return (v >= 0 ? '+€' : '-€') + Math.abs(v).toFixed(2); }
function fmtBal(v) { return '€' + v.toFixed(2); }

function showToast(msg, duration = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ─── JOIN ────────────────────────────────────────────────────
window.joinGame = async function() {
  const num = parseInt(document.getElementById('driverNumInput').value);
  const err = document.getElementById('joinError');
  if (!num || num < 1 || num > 99) { err.textContent = 'Enter a number 1–99'; return; }
  err.textContent = '';
  driverNum = num;
  driverId  = 'driver_' + num;
  localStorage.setItem('driverId', driverId);
  localStorage.setItem('driverNumber', String(num));
  await initDriver();
};

// ─── INIT DRIVER DOC ────────────────────────────────────────
async function initDriver() {
  const ref = doc(db, 'drivers', driverId);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      number: driverNum,
      balance: 50,
      fuel: 100,
      rating: 100,
      trips: 0,
      totalEarnings: 0,
      tripsSinceWash: 0,
      lastAccessFeeRound: 0,
      active: true
    });
  }
  showMain();
  subscribeToGame();
}

function showMain() {
  document.getElementById('joinScreen').style.display = 'none';
  const ms = document.getElementById('mainScreen');
  ms.style.display = 'flex';
  ms.style.flexDirection = 'column';
  document.getElementById('hdrName').textContent = '#' + driverNum;
}

// ─── SUBSCRIBE ──────────────────────────────────────────────
function subscribeToGame() {
  const gameRef   = doc(db, 'game', 'state');
  const driverRef = doc(db, 'drivers', driverId);

  if (unsub) unsub();
  let gameSnap = null, driverSnap = null;

  const tryRender = () => { if (gameSnap && driverSnap) render(gameSnap, driverSnap); };

  onSnapshot(gameRef, snap => {
    gameState = snap.data() || {};
    gameSnap = snap;
    tryRender();
  });
  onSnapshot(driverRef, snap => {
    driverState = snap.data() || {};
    driverSnap = snap;
    tryRender();
  });
}

// ─── RENDER ─────────────────────────────────────────────────
function render(gameSnap, driverSnap) {
  if (!gameState || !driverState) return;

  const fuel    = driverState.fuel    || 0;
  const balance = driverState.balance || 0;
  const rating  = driverState.rating  || 100;
  const trips   = driverState.trips   || 0;
  const tripsSinceWash = driverState.tripsSinceWash || 0;
  const round   = gameState.round || 0;
  const status  = gameState.status || 'waiting';

  // Header
  document.getElementById('hdrRound').textContent = round || '—';

  // Stats
  const balEl = document.getElementById('statBalance');
  balEl.textContent = fmtBal(balance);
  balEl.className = 'stat-value ' + (balance >= 20 ? 'green' : balance >= 8 ? 'orange' : 'red');

  const ratEl = document.getElementById('statRating');
  ratEl.textContent = Math.round(rating) + '%';
  ratEl.className = 'stat-value ' + (rating >= 80 ? 'green' : rating >= 60 ? 'orange' : 'red');

  document.getElementById('statTrips').textContent = trips;

  // Fuel bar
  const fuelFill = document.getElementById('fuelFill');
  fuelFill.style.width = fuel + '%';
  fuelFill.style.background = fuel > 50 ? 'var(--green)' : fuel > 25 ? 'var(--orange)' : 'var(--red)';
  document.getElementById('fuelPct').textContent = Math.round(fuel) + '%';

  // Refuel button glow when fuel < 30
  const btnRefuel = document.getElementById('btnRefuel');
  btnRefuel.className = 'action-btn' + (fuel < 30 ? ' glow-orange' : '');

  // Wash button glow when tripsSinceWash >= 5
  const btnWash = document.getElementById('btnWash');
  btnWash.className = 'action-btn' + (tripsSinceWash >= 5 ? ' glow-green' : '');

  // Debt trap check
  const suspended = balance < 4 && fuel < 30;
  document.getElementById('suspendedOverlay').className =
    'suspended-overlay' + (suspended ? ' active' : '');

  // Round change: apply access fee
  if (status === 'active' && round > 0) {
    maybeApplyAccessFee(round, balance);
  }

  // Main content — don't overwrite if riding or showing results
  if (tripState === 'riding' || tripState === 'results') return;

  renderMain(status, round, balance, fuel, rating, trips);
}

async function maybeApplyAccessFee(round, balance) {
  const lastFeeRound = driverState.lastAccessFeeRound || 0;
  if (lastFeeRound >= round) return;
  const ref = doc(db, 'drivers', driverId);
  try {
    await updateDoc(ref, {
      balance: increment(-2),
      lastAccessFeeRound: round
    });
    // Also track in game state
    const gameRef = doc(db, 'game', 'state');
    await updateDoc(gameRef, { accessFeesRevenue: increment(2) });
    showToast('⚠️ Platform access fee: −€2');
  } catch(e) { console.warn('Access fee error', e); }
}

function renderMain(status, round, balance, fuel, rating, trips) {
  const c = document.getElementById('mainContent');

  if (status === 'ended') {
    const emoji = balance >= 60 ? '🏆' : balance >= 40 ? '😊' : balance >= 20 ? '😅' : '😬';
    c.innerHTML = `
      <div class="ended-card">
        <div class="ended-emoji">${emoji}</div>
        <div class="ended-title">Game Over</div>
        <div class="ended-sub">Final Balance</div>
        <div class="ended-final">${fmtBal(balance)}</div>
        <div class="ended-sub">Rating: ${Math.round(rating)}% · Trips: ${trips}</div>
      </div>`;
    return;
  }

  if (status === 'waiting' || round === 0) {
    c.innerHTML = `
      <div class="waiting-card">
        <div class="waiting-emoji">🚗</div>
        <div class="waiting-title">Waiting for Round to Start</div>
        <div class="waiting-sub">The instructor will start the round shortly</div>
        <div class="dot-pulse"><span></span><span></span><span></span></div>
      </div>`;
    return;
  }

  if (status === 'between') {
    c.innerHTML = `
      <div class="between-card">
        <div style="font-size:32px">☕</div>
        <div style="font-size:15px;font-weight:600">Round ${round} Complete</div>
        <div style="font-size:13px;color:var(--dim)">Waiting for next round…</div>
      </div>`;
    return;
  }

  // Active round — check if order ready
  if (pendingOrder && status === 'active') {
    renderOrderCard(pendingOrder);
    return;
  }

  if (status === 'active') {
    // Generate order with a small delay on round change
    if (round !== lastRenderRound) {
      lastRenderRound = round;
      c.innerHTML = `
        <div class="waiting-card">
          <div class="waiting-emoji">📡</div>
          <div class="waiting-title">Looking for orders…</div>
          <div class="dot-pulse"><span></span><span></span><span></span></div>
        </div>`;
      setTimeout(maybeGenerateOrder, 800 + Math.random() * 1200);
    }
  }
}

// ─── ORDER GENERATION ───────────────────────────────────────
function maybeGenerateOrder() {
  if (tripState !== 'idle') return;
  const fuel    = driverState.fuel    || 0;
  const balance = driverState.balance || 0;
  if (balance < 4 && fuel < 30) return; // suspended

  // Pick scenario (40% chance)
  const scenario = Math.random() < 0.40 ? pick(SCENARIOS) : null;

  // Distance 2–18 km
  const distance = rand(2, 18);
  const isSurge  = nextSurge;
  nextSurge = false;

  // Fare: base 3 + 1.5/km, surge ×1.8
  const baseFare = +(3 + distance * 1.5).toFixed(2);
  const fare     = isSurge ? +(baseFare * 1.8).toFixed(2) : baseFare;

  // Commission (25%)
  const commission = +(fare * 0.25).toFixed(2);
  const earnings   = +(fare - commission).toFixed(2);

  // Difficult customer 15%
  const isDifficult = Math.random() < 0.15;

  pendingOrder = { scenario, distance, fare, earnings, isSurge, isDifficult };
  if (scenario && scenario.surge) nextSurge = true;

  renderOrderCard(pendingOrder);
}

function renderOrderCard(order) {
  if (tripState !== 'idle') return;
  const { scenario, distance, isSurge, isDifficult } = order;
  const c = document.getElementById('mainContent');
  const scenarioHtml = scenario ? `
    <div class="order-difficult">
      <strong>${scenario.emoji} ${scenario.title}:</strong> ${scenario.body}
    </div>` : '';
  const difficultHtml = isDifficult ? `
    <div class="order-difficult" style="border-left-color:var(--red)">
      ⚠️ Note: Customer has specific preferences. Proceed carefully.
    </div>` : '';
  const surgeHtml = isSurge ? `<div style="font-size:11px;color:var(--orange);margin-top:3px">🔥 Surge pricing active</div>` : '';

  c.innerHTML = `
    <div class="order-card">
      <div class="order-header">
        <div class="order-emoji">📦</div>
        <div>
          <div class="order-title">Ride Request</div>
          <div class="order-scenario">Client is waiting</div>
        </div>
      </div>
      ${scenarioHtml}
      ${difficultHtml}
      <div class="order-meta">
        <div class="order-meta-item">
          <div class="order-meta-label">Distance</div>
          <div class="order-meta-value">${distance} km</div>
        </div>
        <div class="order-meta-item">
          <div class="order-meta-label">Fare</div>
          <div class="order-meta-value" style="color:var(--muted);font-style:italic">hidden</div>
          ${surgeHtml}
        </div>
      </div>
      <button class="order-accept" onclick="acceptOrder()">Accept Ride</button>
      <button class="order-skip" onclick="skipOrder()">Skip</button>
    </div>`;
}

window.skipOrder = function() {
  pendingOrder = null;
  lastRenderRound = -1; // Force re-render with new order
  const c = document.getElementById('mainContent');
  c.innerHTML = `
    <div class="waiting-card">
      <div class="waiting-emoji">🔄</div>
      <div class="waiting-title">Looking for another order…</div>
      <div class="dot-pulse"><span></span><span></span><span></span></div>
    </div>`;
  setTimeout(maybeGenerateOrder, 1000 + Math.random() * 1500);
};

// ─── ACCEPT & RIDE ──────────────────────────────────────────
window.acceptOrder = function() {
  if (!pendingOrder || tripState !== 'idle') return;
  tripState = 'riding';

  const { scenario, distance, isDifficult } = pendingOrder;
  const rideDuration = (2.5 + (distance / 18) * 2.5) * 1000; // 2.5s–5s in ms
  const rideSec = (rideDuration / 1000).toFixed(1);

  // Set CSS variable for animation
  document.documentElement.style.setProperty('--ride-duration', rideSec + 's');

  const destNames = ['Airport','City Centre','Old Town','Train Station','Shopping Mall','University','Business Park','Hotel','Hospital','Stadium'];
  const dest = pick(destNames);

  const scenarioLine = scenario ? `<div class="ride-dest">${scenario.emoji} ${scenario.title}</div>` : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="ride-card">
      <div class="ride-title">En route to ${dest}…</div>
      <div class="ride-road">
        <div class="ride-road-line"></div>
        <div class="ride-car">🚗</div>
      </div>
      ${scenarioLine}
      <div class="ride-dest">${distance} km · ~${Math.round(rideDuration/1000)}s</div>
    </div>`;

  setTimeout(() => completeTrip(scenario, isDifficult), rideDuration);
};

// ─── COMPLETE TRIP ──────────────────────────────────────────
async function completeTrip(scenario, isDifficult) {
  tripState = 'results';
  const order = pendingOrder;
  pendingOrder = null;
  const { distance, fare, earnings, isSurge } = order;

  const fuel    = driverState.fuel    || 0;
  const balance = driverState.balance || 0;
  const tripsSinceWash = driverState.tripsSinceWash || 0;
  const isDirty = tripsSinceWash >= 5;
  const tipsPolicy = gameState.tipsPolicy || 'drivers';

  // Fuel cost
  let fuelCost = 5 + distance * 2;
  if (scenario && scenario.fuelExtra) fuelCost += scenario.fuelExtra;
  fuelCost = Math.min(fuelCost, 100);

  // Scenario repair cost
  let repairCost = 0;
  if (scenario && scenario.cost) repairCost = scenario.cost;

  // Star probabilities
  // Base: 0★:25%, 1★:20%, 3★:55%
  // Dirty: 0★:20%, 1★:35%, 3★:45%
  // Scenario modifiers
  let p1 = isDirty ? 35 : 20;
  let p3 = isDirty ? 45 : 55;
  if (scenario) {
    p1 = Math.min(p1 + (scenario.oneStarBoost || 0), 85);
    p3 = Math.max(p3 + (scenario.threeStarBoost || 0), 5);
  }
  let p0 = 100 - p1 - p3;
  if (p0 < 5) { p0 = 5; p3 = 100 - p1 - p0; }

  let stars;
  if (isDifficult && Math.random() < 0.15) {
    stars = 1; // force 1★ for difficult customer
  } else {
    const r = rand(1, 100);
    if (r <= p0) stars = 0;
    else if (r <= p0 + p1) stars = 1;
    else stars = 3;
  }

  // Rating change
  let ratingDelta = 0;
  if (stars === 0) { ratingDelta = 0; }
  else if (stars === 1) { ratingDelta = -rand(4, 8); }
  else { ratingDelta = rand(2, 3); }

  const newRating = Math.min(100, Math.max(0, (driverState.rating || 100) + ratingDelta));

  // Comment
  const comment = stars === 0 ? pick(COMMENTS_0) :
                  stars === 1 ? pick(COMMENTS_1) : pick(COMMENTS_3);

  // Star display
  const starEmoji = stars === 0 ? '😶 No rating' :
                    stars === 1 ? '⭐' : '⭐⭐⭐';

  // Tip
  let tipAmount = 0;
  let showTip   = false;
  if (scenario && scenario.tip) {
    tipAmount = rand(1, 4);
    showTip = true;
  }

  // Earnings after repairs
  const netEarnings = earnings - repairCost;

  // Fuel delta
  const newFuel = Math.max(0, fuel - fuelCost);
  const fuelDelta = -fuelCost;

  // Balance changes
  let balanceDelta = netEarnings;
  if (tipsPolicy === 'drivers' && showTip) balanceDelta += tipAmount;
  const newBalance = balance + balanceDelta;

  // Build results rows
  const rows = [];
  rows.push({ label: `Distance`, value: `${distance} km`, cls: '' });
  rows.push({ label: `Rating`, value: `${starEmoji}`, cls: '', comment });
  if (ratingDelta !== 0) {
    rows.push({ label: `Rating %`, value: (ratingDelta > 0 ? '+' : '') + ratingDelta + '%', cls: ratingDelta > 0 ? 'green' : 'red' });
  }
  rows.push({ label: `Fare (after 25% commission)`, value: `€${earnings.toFixed(2)}`, cls: 'green' });
  if (repairCost > 0) {
    rows.push({ label: `🔧 ${scenario.emoji} Repair cost`, value: `-€${repairCost.toFixed(2)}`, cls: 'red' });
  }
  if (showTip) {
    rows.push({ label: `Tip from client`, value: `+€${tipAmount.toFixed(2)} 🎉`, cls: tipsPolicy === 'drivers' ? 'green' : 'orange' });
  }
  rows.push({ label: `Fuel used`, value: `${Math.round(fuelCost)}%`, cls: 'orange' });
  rows.push({ label: `Balance`, value: `€${newBalance.toFixed(2)}`, cls: newBalance >= 0 ? 'green' : 'red' });

  // Render results card
  const c = document.getElementById('mainContent');
  const rowsHtml = rows.map((r,i) => `
    <div class="result-row" id="rrow${i}">
      <div class="result-label">${r.label}${r.comment ? `<div class="result-comment">"${r.comment}"</div>` : ''}</div>
      <div class="result-value ${r.cls}">${r.value}</div>
    </div>`).join('');

  c.innerHTML = `
    <div class="results-card">
      <div class="results-header">Trip Complete</div>
      ${rowsHtml}
      <button class="results-dismiss" id="dismissBtn" onclick="dismissResults()">Next order →</button>
    </div>`;

  // Sequential reveal
  rows.forEach((_, i) => {
    setTimeout(() => {
      const el = document.getElementById('rrow' + i);
      if (el) el.classList.add('visible');
    }, 300 + i * 350);
  });
  setTimeout(() => {
    const btn = document.getElementById('dismissBtn');
    if (btn) btn.classList.add('visible');
  }, 300 + rows.length * 350 + 200);

  // Show tip toast (silent theft if platform captures)
  if (showTip) {
    setTimeout(() => {
      if (tipsPolicy === 'platform') {
        showToast(`+€${tipAmount.toFixed(2)} tip 🎉`);
      } else {
        showToast(`+€${tipAmount.toFixed(2)} tip received 🎉`);
      }
    }, 300 + 4 * 350);
  }

  // Firestore updates
  const ref = doc(db, 'drivers', driverId);
  const updateData = {
    fuel: Math.round(newFuel),
    balance: +newBalance.toFixed(2),
    rating: +newRating.toFixed(1),
    trips: increment(1),
    totalEarnings: increment(+earnings.toFixed(2)),
    tripsSinceWash: increment(1)
  };
  await updateDoc(ref, updateData).catch(e => console.warn('Trip update failed', e));

  // Platform stats
  const gameRef = doc(db, 'game', 'state');
  const gameUpdate = { commissionsRevenue: increment(+earnings.toFixed(2)) };
  if (showTip && tipsPolicy === 'platform') {
    gameUpdate.platformTipsRevenue = increment(tipAmount);
  }
  if (showTip && tipsPolicy === 'drivers') {
    gameUpdate.driverTipsTotal = increment(tipAmount);
  }
  await updateDoc(gameRef, gameUpdate).catch(e => console.warn('Platform update failed', e));
}

window.dismissResults = function() {
  tripState = 'idle';
  lastRenderRound = -1;
  const c = document.getElementById('mainContent');
  c.innerHTML = `
    <div class="waiting-card">
      <div class="waiting-emoji">📡</div>
      <div class="waiting-title">Looking for orders…</div>
      <div class="dot-pulse"><span></span><span></span><span></span></div>
    </div>`;
  setTimeout(maybeGenerateOrder, 600 + Math.random() * 800);
};

// ─── REFUEL ─────────────────────────────────────────────────
window.doRefuel = async function() {
  const balance = driverState.balance || 0;
  const fuel    = driverState.fuel    || 0;
  if (balance < 4) { showToast('Not enough balance to refuel (€4)'); return; }
  if (fuel >= 95)  { showToast('Fuel already full'); return; }
  const ref = doc(db, 'drivers', driverId);
  await updateDoc(ref, { balance: increment(-4), fuel: 100 });
  showToast('⛽ Refuelled! −€4');
};

// ─── CAR WASH ───────────────────────────────────────────────
window.doWash = async function() {
  const balance = driverState.balance || 0;
  if (balance < 1) { showToast('Not enough balance (€1)'); return; }
  const ref = doc(db, 'drivers', driverId);
  await updateDoc(ref, { balance: increment(-1), tripsSinceWash: 0 });
  showToast('🚿 Car washed! −€1');
};

// ─── AUTO-REJOIN ─────────────────────────────────────────────
if (driverId) initDriver();
</script>

</html>
